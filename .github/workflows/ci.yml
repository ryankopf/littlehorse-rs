name: Rust SDK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.89.0
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
        if: matrix.rust == 'stable'
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        if: matrix.rust == 'stable'
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check-packages.py
  stable-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start compatibility server v1.3.1
        run: docker run -d --name littlehorse -p 2023:2023 ghcr.io/littlehorse-enterprises/littlehorse/lh-standalone:1.3.1
      - run: cargo test --test live_server --test live_features --locked -- --ignored --nocapture
      - if: failure()
        run: docker logs --tail 300 littlehorse
      - if: always()
        run: docker rm -f littlehorse
  upstream-master:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LITTLEHORSE_SCHEMA_DIR: ${{ github.workspace }}/upstream/schemas/littlehorse
      LITTLEHORSE_CONFORMANCE_DIR: ${{ github.workspace }}/upstream/sdk-conformance/areas
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned master revision
        id: pin
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("upstream.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: littlehorse-enterprises/littlehorse
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/check-upstream.py upstream
      - name: Build pinned server and Java reference testee
        working-directory: upstream
        run: ./gradlew :server:installDist :sdk-java-conformance:installDist -x test -x spotlessJavaCheck --no-daemon
      - name: Compile Rust against shared master schemas
        run: cargo build --features conformance --bin lh-conformance --locked
      - name: Grade both SDKs and compare 50 seeded workflows
        run: python3 scripts/run-conformance.py --upstream upstream --reference-java
      - name: Test using shared conformance fixtures
        run: cargo test --workspace --all-features --all-targets --locked
      - name: Build standalone server from the pinned source
        run: |
          cat > "$RUNNER_TEMP/Dockerfile.master" <<'DOCKERFILE'
          FROM ghcr.io/littlehorse-enterprises/littlehorse/lh-standalone@sha256:ddc8a42f1f4ec397643f755fa245fd0dfe66943afb51a36b16dc11b24586e8d0
          ARG UPSTREAM_COMMIT
          LABEL org.opencontainers.image.revision=$UPSTREAM_COMMIT
          RUN rm -rf /lh/lib /lh/bin/server
          COPY server/build/install/server/lib /lh/lib
          COPY server/build/install/server/server /lh/bin/
          COPY docker/standalone/kafka-entrypoint.sh docker/standalone/littlehorse-entrypoint.sh docker/standalone/docker-entrypoint.sh /lh/
          RUN test -f /lh/bin/server && chmod +x /lh/bin/server /lh/*entrypoint.sh
          DOCKERFILE
          docker build --build-arg UPSTREAM_COMMIT="${{ steps.pin.outputs.commit }}" -f "$RUNNER_TEMP/Dockerfile.master" -t littlehorse-rust-master upstream
          docker run -d --name littlehorse -p 2023:2023 littlehorse-rust-master
      - name: Execute master and compatibility behavior tests
        run: cargo test --test live_server --test live_features --test live_master --locked -- --ignored --nocapture
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-conformance
          path: target/conformance-results.json
          if-no-files-found: ignore
      - if: failure()
        run: docker logs --tail 300 littlehorse || true
      - if: always()
        run: docker rm -f littlehorse || true
